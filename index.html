let S=seed(),PUB=null,PUBJ="";
const REP=(k,v)=>k=="tel"?undefined:v,clone=o=>JSON.parse(JSON.stringify(o));
function setS(){if(CLOUD){LAST=null;UNDO=[];return}let w=null;if(AUTH){try{w=JSON.parse(localStorage.getItem(KEY))}catch(e){}}S=AUTH?(w&&w.defs?w:clone(PUB||seed())):(PUB||seed());LAST=null;UNDO=[];EDIT.clear()}
let tab="w",AUTH=false;try{AUTH=sessionStorage.getItem("vym_auth")=="1"}catch(e){}
let LAST=null,UNDO=[],PQ="";

function nrm(s){return String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>"d"+Math.random().toString(36).slice(2,8);

function people(){const s=new Set();S.weeks.forEach(w=>Object.values(w.a).forEach(v=>v&&String(v).split(" / ").forEach(x=>x.trim()&&s.add(x.trim()))));return[...s].sort()}
const FEM="Elizabeth Débora Abigaíl Ana Avril Florencia Sofía Inés Gabriela Irína Fiorella Bargavi Lucía Karien Denise Mikaela".split(" ");
const TM={A:["Crai, Claudio","Arena, Abigaíl","Llanes, Irína","Alwar, Bargavi"],B:["Del Signore, Bernardo","De Castellet, Ana","Brignoni, Benjamín","Del Signore, Lucía"],C:["Del Signore, Lucas","Del Signore, Avril","Debia, Karien"],D:["Michelena, Federico","Ferraro, Florencia","Moreira, Denise"],E:["Astorino, Fabrizzio","Díaz, Sofía","Pérez, Mikaela"],F:["Fernández de León, Juan","Farina, Elizabeth","Maubrigades, Inés","Martinez, Fiorella"],G:["Robinson, Michael","Ferreira, Débora","Martinez, Gabriela","Bernal, Ronald"]};
const tp=n=>FEM.includes(n.split(", ")[1])?"hermana":"hermano";
function np(n){return{id:uid(),name:n,cat:"",tipo:tp(n),tel:"",team:"",en:true,aus:[]}}
function mig(){
if(!S.people)S.people=people().map(np);
S.people=S.people.filter(p=>!/^Equipo [A-G]$/.test(p.name));
S.people.forEach(p=>{if(p.en==null)p.en=true;if(!p.aus)p.aus=[];if(!p.tipo)p.tipo=tp(p.name);if(p.tel==null)p.tel="";if(p.team==null)p.team="";if(p.cat=="Publicador"||p.tipo=="hermana")p.cat=""});
if(!S.teams){S.teams=Object.keys(TM).map(k=>({id:"t"+k,name:"Equipo "+k}));Object.entries(TM).forEach(([k,ns])=>ns.forEach(n=>{let p=S.people.find(x=>x.name==n);if(!p){p=np(n);S.people.push(p)}p.team="t"+k}));S.people.sort((a,b)=>a.name.localeCompare(b.name))}
S.weeks.forEach(w=>{const t=S.teams.find(t=>t.name==w.a.lim);if(t)w.a.lim=t.id});
S.defs.forEach(d=>{if(d.fem==null)d.fem=["m4","m5","m7"].includes(d.id);if(d.req==null)d.req=""});
if(!S.gemfix){S.weeks.forEach(w=>{if(w.a.pres&&!w.a.gem&&!(w.hid||[]).includes("gem"))w.a.gem=w.a.pres});S.defs.forEach(d=>{if(d.id=="gem"&&d.name=="Perlas escondidas")d.name="Busquemos perlas escondidas"});S.gemfix=1}
if(!S.tpls)S.tpls=[];
S.defs.forEach(d=>{if(d.comb==null)d.comb=d.id=="pres"?["gem"]:[]});
S.weeks.forEach(w=>{const d=pd(w.date);if(d&&!/^\d{4}-\d{2}-\d{2}$/.test(w.date))w.date=ymd(d)});
S.weeks.sort((a,b)=>{const x=pd(a.date),y=pd(b.date);return(x?x.getTime():9e15)-(y?y.getTime():9e15)});
if(!CLOUD)save()}
const VERSION="2.1";
const DIAS=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"],MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function dsp(s){const d=pd(s);if(!d)return String(s||"");return DIAS[d.getDay()]+" "+d.getDate()+" de "+MESES[d.getMonth()]+(d.getFullYear()!=new Date().getFullYear()?" de "+d.getFullYear():"")}
function sdt(s){const d=pd(s);return d?d.getDate()+" "+MESES[d.getMonth()].slice(0,3):String(s)}
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
const CS=["Anciano","Siervo Ministerial","Superintendente de Circuito"];
function cfgR(){return Object.assign({ms:3,pr:false},(S.cfg&&S.cfg.rep)||{})}
function has(w,n){if(!w||w.nm)return false;const c=cfgR();return Object.entries(w.a).some(([k,v])=>k!="lim"&&(c.pr||(k!="orI"&&k!="orF"))&&String(v).split(" / ").includes(n))}
function adef(w,n){if(w.nm)return[];return wdefs(w).filter(d=>d.id!="lim"&&String(w.a[d.id]||"").split(" / ").includes(n)).map(d=>d.id)}
function dupi(wi,n){const w=S.weeks[wi],ds=wdefs(w);let L=adef(w,n);L=L.filter(id=>!L.some(o=>o!=id&&((ds.find(x=>x.id==o)||{}).comb||[]).includes(id)));const tw=ds.some(d=>String(w.a[d.id]||"").split(" / ").filter(x=>x==n).length>1),pr=L.filter(x=>x=="orI"||x=="orF").map(x=>x);return{dup:L.length>1,tw,L,pr:L.length==2?pr:[],y:L.length==2&&pr.length>0}}
function gr(p){return p.tipo=="hermana"?"Hermanas":p.cat||"Hermanos"}
function badge(p){const h=p.tipo=="hermana",t=h?'<span class="bdg bh">Hermana</span>':'<span class="bdg bp">Hermano</span>';return t+(!h&&p.cat=="Anciano"?'<span class="bdg ba">Anciano</span>':!h&&p.cat=="Siervo Ministerial"?'<span class="bdg bs">Siervo Ministerial</span>':!h&&p.cat=="Superintendente de Circuito"?'<span class="bdg bc">Superintendente de Circuito</span>':"")}
function flag(wi,v,id){if(!v||!AUTH)return"";const a=[],di=dupi(wi,v),ds=wdefs(S.weeks[wi]),nmOf=x=>((ds.find(y=>y.id==x)||{}).name)||x;
if(di.tw)a.push("dos veces en esta asignación");

if(id!="orI"&&id!="orF"&&streak(wi,v))a.push(cfgR().ms+" semanas seguidas");
const pp=S.people.find(p=>p.name==v);if(pp&&!okp(pp,id,wi))a.push("no permitido en esta asignación");if(pp&&pp.en===false)a.push("no habilitado");if(pp&&absent(pp,wi))a.push("ausente");return a.length?"❗ <small>"+a.join(" · ")+"</small>":""}
function refl(){m.querySelectorAll("select[data-d]").forEach(s=>{const pb=s.nextElementSibling;if(pb&&pb.classList.contains("pk"))pb.textContent=s.value||"Elegir persona…";if(s.dataset.d=="lim")return;const f=document.getElementById(`f${s.dataset.w}_${s.dataset.d}_${s.dataset.k}`);if(f)f.innerHTML=flag(+s.dataset.w,s.value,s.dataset.d)})}
function tmem(id){return id?S.people.filter(p=>p.team==id).map(p=>esc(p.name)).join("<br>"):""}
function runOf(wi,n,assume){const N=cfgR().ms;if(!N||N<2)return null;const w0=S.weeks[wi];if(!w0||w0.nm)return null;const M=[];S.weeks.forEach((w,i)=>{if(!w.nm)M.push(i)});const k=M.indexOf(wi);if(k<0)return null;
const h=i=>(assume&&i==wi)||has(S.weeks[i],n),near=(a,b)=>{const da=pd(S.weeks[M[a]].date),db=pd(S.weeks[M[b]].date);return !da||!db||(db-da)/864e5<=15};
for(let s0=Math.max(0,k-N+1);s0<=k&&s0+N-1<M.length;s0++){let ok=true;for(let j=s0;j<s0+N;j++){if(!h(M[j])||(j>s0&&!near(j-1,j))){ok=false;break}}if(ok)return M.slice(s0,s0+N)}return null}
function streak(wi,n){return !!runOf(wi,n)}
function acc(w,n,kind){w.ok=w.ok||[];const k=n+"|"+kind;if(!w.ok.includes(k))w.ok.push(k)}
function alertsW(wi){const w=S.weeks[wi],ds=wdefs(w),seen=new Set(),o=[],ok=w.ok||[];if(w.nm)return o;ds.forEach(d=>{if(d.id=="lim")return;String(w.a[d.id]||"").split(" / ").filter(Boolean).forEach(n=>{if(seen.has(n))return;seen.add(n);const p=S.people.find(x=>x.name==n),t=[],di=dupi(wi,n),nmOf=id=>(ds.find(x=>x.id==id)||{}).name||id;
if(di.tw&&!ok.includes(n+"|tw"))t.push("está dos veces en la misma asignación");
if(di.dup&&!ok.includes(n+"|dup"))t.push("repetido: "+di.L.map(nmOf).join(", "));
const rn=runOf(wi,n);if(rn&&!ok.includes(n+"|rn"))t.push(rn.length+" semanas seguidas");
